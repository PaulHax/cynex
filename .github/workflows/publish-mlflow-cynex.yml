name: Publish mlflow-cynex to PyPI

on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Inject version from tag
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          sed -i "s/version = \"0.0.0\"/version = \"$VERSION\"/" mlflow-integration/pyproject.toml

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - run: pip install build

      - name: Build frontend
        run: |
          npm ci
          VITE_BASE_PATH='/static-files/cynex/' npm run build

      - name: Copy to package
        run: |
          mkdir -p mlflow-integration/src/mlflow_cynex/static/cynex
          cp -r dist/* mlflow-integration/src/mlflow_cynex/static/cynex/
          rm -rf mlflow-integration/src/mlflow_cynex/static/cynex/data

      - name: Build wheel
        working-directory: mlflow-integration
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: mlflow-integration/dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
