name: Release mlflow-cynex

on:
  push:
    branches: [main]

jobs:
  tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.bump.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create bumped tag
        id: bump
        run: |
          LATEST=$(git tag -l 'v*' --sort=-v:refname | head -n1)
          if [ -z "$LATEST" ]; then
            NEW_TAG="v0.1.0"
          else
            VERSION=${LATEST#v}
            MAJOR=$(echo $VERSION | cut -d. -f1)
            MINOR=$(echo $VERSION | cut -d. -f2)
            PATCH=$(echo $VERSION | cut -d. -f3)
            NEW_TAG="v$MAJOR.$MINOR.$((PATCH + 1))"
          fi
          git tag $NEW_TAG
          git push origin $NEW_TAG
          echo "version=${NEW_TAG#v}" >> $GITHUB_OUTPUT

  publish:
    needs: tag
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Inject version
        run: |
          sed -i "s/version = \"0.0.0\"/version = \"${{ needs.tag.outputs.version }}\"/" mlflow-integration/pyproject.toml

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - run: pip install build

      - name: Build frontend
        run: |
          npm ci
          VITE_BASE_PATH='/static-files/cynex/' npm run build

      - name: Copy to package
        run: |
          mkdir -p mlflow-integration/src/mlflow_cynex/static/cynex
          cp -r dist/* mlflow-integration/src/mlflow_cynex/static/cynex/
          rm -rf mlflow-integration/src/mlflow_cynex/static/cynex/data

      - name: Build wheel
        working-directory: mlflow-integration
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: mlflow-integration/dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.tag.outputs.version }}
          generate_release_notes: true
