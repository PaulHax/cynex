<svg xmlns="http://www.w3.org/2000/svg" width="3072" height="512" viewBox="0 0 192 32">
  <!-- Host icon atlas: 6 icons, each 32x32. Single-color white so deck.gl IconLayer can tint via mask. -->

  <!-- Icon 0: database (stacked disks) at x=0..31 -->
  <g
    transform="translate(0 0)"
    fill="none"
    stroke="#ffffff"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    <!-- top disk -->
    <ellipse cx="16" cy="8" rx="10" ry="4" />
    <!-- vertical sides -->
    <path d="M6 8 V24" />
    <path d="M26 8 V24" />
    <!-- middle separator (two-disk look) -->
    <ellipse cx="16" cy="16" rx="10" ry="4" />
    <!-- bottom disk -->
    <ellipse cx="16" cy="24" rx="10" ry="4" />
  </g>

  <!-- Icon 1: auth (shield) at x=32..63 -->
  <g
    transform="translate(32 0)"
    fill="none"
    stroke="#ffffff"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    <path d="M16 5 L24 8 V15 C24 21 20 25 16 27 C12 25 8 21 8 15 V8 Z" />
    <!-- simple keyhole/check mark for security emphasis -->
    <path d="M12.5 16 L15 18.5 L20 13.5" />
  </g>

  <!-- Icon 2: front (globe grid) at x=64..95 -->
  <g
    transform="translate(64 0)"
    fill="none"
    stroke="#ffffff"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    <g transform="translate(4 6)">
      <!-- latitude lines and outer circle -->
      <path d="M20.5 9.035a9.004 9.004 0 0 0-17 0m17 0c.324.928.5 1.926.5 2.965a8.988 8.988 0 0 1-.5 2.966m0-5.931h-17m0 0A8.987 8.987 0 0 0 3 12a8.99 8.99 0 0 0 .5 2.966m0 0a9.004 9.004 0 0 0 17 0m-17 0h17" />
      <!-- longitude curve -->
      <path d="M12 21c4.97-4.97 4.97-13.03 0-18-4.97 4.97-4.97 13.03 0 18z" />
    </g>
  </g>

  <!-- Icon 3: server tower at x=96..127 -->
  <g
    transform="translate(96 0)"
    fill="none"
    stroke="#ffffff"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    <path d="M10 6 H22 C23.1 6 24 6.9 24 8 V24 C24 25.1 23.1 26 22 26 H10 C8.9 26 8 25.1 8 24 V8 C8 6.9 8.9 6 10 6 Z" />
    <path d="M11 11 H21" />
    <path d="M11 15 H21" />
    <path d="M11 19 H21" />
    <circle cx="12" cy="23" r="1" />
    <circle cx="16" cy="23" r="1" />
  </g>

  <!-- Icon 4: workstation / laptop at x=128..159 -->
  <g transform="translate(128 0)" fill="#ffffff">
    <path d="M10 8 H22 C23.1 8 24 8.9 24 10 V19 C24 20.1 23.1 21 22 21 H10 C8.9 21 8 20.1 8 19 V10 C8 8.9 8.9 8 10 8 Z" />
    <path d="M6 23 H26 V25 H6 Z" />
  </g>

  <!-- Icon 5: defender (chess rook) at x=160..191 -->
  <g transform="translate(160 0)">
    <g transform="scale(0.0625)" fill="#ffffff">
      <path d="M406 484.7H106v-60h300v60zm-56.67-330.83h-50.05V91.3h-82.39v62.57h-54.22V91.3h-54.23v113.67h295.12V91.3h-54.23v62.57zm23.35 67.23H139.32v187.6h233.36V221.1z" />
    </g>
  </g>
</svg>
